[workspace]
resolver = "3"
members = ["crates/core", "crates/build", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"

[workspace.dependencies]
hundred-core = { path = "crates/core" }
hundred-build = { path = "crates/build" }
anyhow = "1"
bzip2 = "0.5"
caseless = "0.2"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
fst = "0.4"
memmap2 = "0.9"
proptest = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
time = "0.3"
unicode-normalization = "0.1"

[profile.release]
debug = 1
