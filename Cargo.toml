[workspace]
resolver = "3"
members = ["crates/core", "crates/build", "crates/server", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"

[workspace.dependencies]
hundred-core = { path = "crates/core" }
hundred-build = { path = "crates/build" }
hundred-server = { path = "crates/server" }
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
bzip2 = "0.5"
caseless = "0.2"
criterion = "0.5"
figment = { version = "0.10", features = ["toml", "env"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
fst = "0.4"
levenshtein_automata = { version = "0.2", features = ["fst_automaton"] }
memmap2 = "0.9"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
proptest = "1"
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "macros", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
http-body-util = "0.1"
unicode-normalization = "0.1"

[profile.release]
debug = 1
